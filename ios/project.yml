name: GlucoBit
options:
  bundleIdPrefix: com.jdharcourt
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    GENERATE_INFOPLIST_FILE: NO

targets:
  GlucoBit:
    type: application
    platform: iOS
    sources:
      - path: GlucoBit
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jdharcourt.glucobit
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: GlucoBit/Info.plist
      properties:
        CFBundleDisplayName: GlucoBit
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSBluetoothAlwaysUsageDescription: >-
          GlucoBit uses Bluetooth to set up your display device and to send it
          glucose readings when its WiFi connection is unavailable.
        NSHealthShareUsageDescription: >-
          GlucoBit can read glucose history from Apple Health.
        NSHealthUpdateUsageDescription: >-
          GlucoBit can save your glucose readings to Apple Health.
        UIBackgroundModes:
          - bluetooth-central
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.jdharcourt.glucobit.refresh
        UIAppFonts:
          - Nunito-Variable.ttf
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: GlucoBit/GlucoBit.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.jdharcourt.glucobit
        com.apple.developer.healthkit: true
    dependencies:
      - target: GlucoBitWidget
        embed: true

  GlucoBitWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: GlucoBitWidget
      - path: Shared
      - path: GlucoBit/Resources/Fonts
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jdharcourt.glucobit.widget
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: GlucoBitWidget/Info.plist
      properties:
        CFBundleDisplayName: GlucoBit
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - Nunito-Variable.ttf
    entitlements:
      path: GlucoBitWidget/GlucoBitWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.jdharcourt.glucobit

schemes:
  GlucoBit:
    build:
      targets:
        GlucoBit: all
    run:
      config: Debug
    archive:
      config: Release
